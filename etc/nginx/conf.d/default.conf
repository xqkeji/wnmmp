server {
	listen 80; 
	server_name localhost;
	charset utf-8;

	access_log logs/nginx/localhost_access.log;
	error_log logs/nginx/localhost_error.log;

	root "www/default";
	location = /favicon.ico {
		try_files $uri =204;
		log_not_found off;
		access_log off;
	}
		
	location / {
		index  index.html index.htm index.php;
		autoindex  off;
		try_files $uri $uri/ /index.php?_url=$uri&$args;
		location ~ \.php$ {
			try_files  $uri =404;
			fastcgi_pass   php_processes;
			fastcgi_index  index.php;
			fastcgi_param  SCRIPT_FILENAME    $document_root$fastcgi_script_name;
			include        fastcgi_params;
		}

		## Static files
		location ~* \.(?:css|gif|htc|ico|js|jpe?g|png|swf)$ {
			expires max;
			log_not_found off;
			tcp_nodelay off;
			open_file_cache max=1000 inactive=120s;
			open_file_cache_valid 45s;
			open_file_cache_min_uses 2;
			open_file_cache_errors off;
		}
		location ~* ^.+\.(?:ogg|pdf|pptx?)$ {
			expires 30d;
			tcp_nodelay off;
		}
	} 
	
	location ^~ /crm/ {
		proxy_pass http://127.0.0.1/;
		proxy_set_header Host crm.xqkeji.com;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

		# ===== 让后端 PHP 的 REMOTE_ADDR 直接变成真实客户端 IP =====
		set_real_ip_from 127.0.0.1;      # 信任来源为前端代理（本机）
		real_ip_header   X-Real-IP;      # 从 X-Real-IP 头取真实 IP
		real_ip_recursive on;            # 多层代理时逐级剥离可信地址

		proxy_buffering off;
		proxy_set_header Accept-Encoding "";
		sub_filter_types application/javascript;
		sub_filter_once off;
		# HTML 链接（安全）
		sub_filter 'href="/'  'href="/crm/';
		sub_filter 'src="/'   'src="/crm/';
		sub_filter 'action="/' 'action="/crm/';
		# JS 跳转（只替换 JS 里的路径，绝对不影响图标）
		sub_filter '="/'  '="/crm/';
		sub_filter '=\'/'  '=\'/crm/';
		# 修复后端 302 跳转（退出登录）
		proxy_redirect / /crm/;
	}

}
