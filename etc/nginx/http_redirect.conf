# HTTP to HTTPS redirect - included at http level by etc/nginx/nginx.conf.
#
# bin\make-ssl.bat enable adds both "include ssl.conf;" and
# "include http_redirect.conf;" to nginx.conf, and install.bat runs that tool as
# its last step, so a freshly installed wnmmp already serves https. The same
# switch rewrites every site in conf.d from "listen 80" to "listen 443 ssl", so
# the block below is the only thing left on port 80: it answers any plain http
# request with a 301 to the same host and path over https.
#
# bin\make-ssl.bat disable removes this include line together with the ssl.conf
# one, the sites go back to "listen 80", and nothing listens for the redirect.
#
# $host is what the visitor actually typed, so localhost, 127.0.0.1 and every
# *.xqkeji.dev hosts entry redirect to themselves on 443, where the matching
# virtual host picks them up. "server_name _" only matches because no site is
# left on 80 to compete with it; a port-80 block you write yourself would win
# for its own names, which is the behaviour you would expect.
#
# Paths are relative to the nginx prefix (-p HOME_DIR), like "root" in the sites.

server {
	listen 80;
	server_name _;
	return 301 https://$host$request_uri;
}
