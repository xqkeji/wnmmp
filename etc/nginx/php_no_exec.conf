# PHP must never be executed from the asset and the upload directories.
#
# Every site in etc/nginx/conf.d includes this file inside its "location /",
# BEFORE the "location ~ \.php$" block that passes requests to php-cgi. Regex
# locations are tested in the order they are written, so the block below wins
# for these URIs and the fastcgi block never sees them. Keep the include line
# in that position when you add a new virtual host, and keep it inside
# "location /": at server level it does not override the php handler.
#
# asset/   the shipped javascript and css libraries, nothing there is code
# upload/  files the application writes from user input -- the usual place an
#          attacker tries to drop and run a .php
#
# The ^ anchor is the document root of the site that includes this file, so for
# the crm site the covered directories are www/crm/www/asset and
# www/crm/www/upload. Requests under a proxied sub-path such as the /crm/ block
# in default.conf go to their own virtual host first, and that host includes
# this file too, so its directories are protected as well.
#
# Both lists live here, so a new directory or a new php handler extension only
# has to be added in one file.

location ~* ^/(?:asset|upload)/.*\.(?:php\d?|phtml\d?|phar)$ {
	deny all;
}
