# wnmmp HTTPS parameters - included at http level by etc/nginx/nginx.conf.
#
# The two files below are created by bin\make-ssl.bat, which uses bin\mkcert.exe
# to build a local certificate authority and sign one certificate whose Subject
# Alternative Names cover localhost, 127.0.0.1, ::1 and *.xqkeji.com. They live
# in etc\nginx\ssl, which .gitignore keeps out of the repository: the private
# key belongs to the machine that generated it.
#
# This file is only read while the sites are on 443. Switching back to plain
# http (bin\make-ssl.bat disable) removes the include line from nginx.conf, so
# nginx then starts fine without any certificate at all.
#
# ssl_certificate is resolved against the directory of nginx.conf, exactly like
# "include mime.types" above it -- that is why these paths start with "ssl/" and
# not with "etc/". Forward slashes are what nginx expects.

ssl_certificate     ssl/wnmmp.pem;
ssl_certificate_key ssl/wnmmp-key.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:wnmmp_ssl:10m;
ssl_session_timeout 1d;
