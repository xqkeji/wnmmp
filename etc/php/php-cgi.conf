# wnmmp php-cgi multi-process settings.
# Read by start.bat / stop.bat / install_service.bat / uninstall_service.bat
# through bin\php-cgi-util.bat, and it is the only place the process count
# lives.
#
# A Windows php-cgi.exe process listens on exactly one port, so the process
# count equals the port count: process i listens on port+i-1 and its Windows
# service is wnmmp-php-cgi-i. The nginx upstream list in
# etc\nginx\php_processes.conf is rebuilt from these values, never edited.
#
# Keep this file plain ASCII: a UTF-8 BOM before the first key makes the
# scripts ignore the whole file and fall back to the defaults below.
#
# processes = how many php-cgi.exe processes to run, 1-16
# port      = first port, process i uses port+i-1
processes=4
port=9000
