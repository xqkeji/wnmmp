; wnmmp component versions - single source of truth.
; This file replaces the old network probing (bin/get-latest.bat, removed).
; Install is fully deterministic: NO version is auto-detected at install time.
; Upgrade a component by editing its version below, one key=value per line.
;
; Rules:
;   * ';' or '#' at line start begins a comment; blank lines are ignored.
;   * Spaces around '=' are allowed.
;   * Do NOT put '=' inside a value (it would truncate the value).
;   * This file MUST stay UTF-8 without BOM and pure CRLF, see .gitattributes.

; ------------------------------------------------------------------ web server
nginx=1.31.4

; ---------------------------------------------------------------------- mysql
; Since 2026-07 the Innovation line uses calendar version YY.M.P:
; 26.7.0 = the 2026-07 build. The LTS line (9.7 / 8.4) keeps the OLD numbering
; scheme and the two lines are independent -- do NOT compare "9.7 vs 26.7" to
; decide which is newer. Pick ONE line and keep its scheme consistent.
mysql=26.7.0

; ------------------------------------------------------------ mongodb + shell
mongodb=8.3.8
mongosh=2.10.0

; ------------------------------------------------------------------------ php
; Runtime build is nts / vs17 / x64. Major.minor drives PECL build selection.
php=8.5.10

; --------------------------------------------------------------------- xqkeji
; gitee tag of the prebuilt DLL. The -php<MM> suffix tells which PHP the DLL
; was built for: it MUST match the php= major.minor above, otherwise php.exe
; fails to load the extension.
xqkeji=v1.1.2-php8.5
